name: Update Satori cask

# Checks for a new Satori release every few hours and updates the cask's
# version and checksum, so `brew upgrade` always offers the latest release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view -R emcee5000/satori --json tagName --jq .tagName)"
          version="${latest#v}"
          current="$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/satori.rb)"
          if [ "$version" = "$current" ]; then
            echo "Already at $version"
            exit 0
          fi
          gh release download "$latest" -R emcee5000/satori -p Satori.zip -O Satori.zip
          sha="$(sha256sum Satori.zip | cut -d' ' -f1)"
          sed -i "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/satori.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Satori to $version"
          git push
